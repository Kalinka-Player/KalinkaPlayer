name: Supervisor packages
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (empty builds an upgradable test version)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/kalinka-supervisor/go.mod
          cache-dependency-path: packages/kalinka-supervisor/go.sum
      - name: Test
        run: |
          make supervisor-test
          python3 -m unittest discover -s scripts/tests -v
      - name: Build both architectures
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          export VERSION="${REQUESTED_VERSION:-0.1.0~ci.${GITHUB_RUN_NUMBER}+g${GITHUB_SHA:0:8}}"
          for arch in amd64 arm64; do
            GOARCH="$arch" make supervisor-deb
          done
          cd packages/kalinka-supervisor/build
          sha256sum ./*.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: supervisor-packages
          path: |
            packages/kalinka-supervisor/build/*.deb
            packages/kalinka-supervisor/build/SHA256SUMS
          if-no-files-found: error
