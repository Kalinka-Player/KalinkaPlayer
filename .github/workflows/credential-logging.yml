name: Credential logging

# Flags code that could write a credential to a log, on every pull request, so
# each finding lands as an annotation on the line under review. A reviewed
# false positive is kept with `# log-safe: <why>` on the flagged call.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: No credential in a log
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check every package's sources
        run: python scripts/check_credential_logging.py
