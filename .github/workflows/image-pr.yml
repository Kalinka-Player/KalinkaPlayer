name: Image boot test

# Boots the same PC image as releases, through UEFI with Secure Boot and
# through a legacy BIOS. Physical radio E2E is separate.

on:
  pull_request:
    paths:
      - 'packages/kalinka-image/**'
      - 'packages/kalinka-supervisor/**'
      - 'scripts/install-release.sh'
      - 'scripts/install-supervisor.sh'
      - 'scripts/install-renderer.sh'
      - 'scripts/tag_version.sh'
      - '.github/actions/build-image/**'
      - '.github/workflows/image-pr.yml'
      - '.github/workflows/image-build.yml'
      - '.github/workflows/supervisor-packages.yml'

permissions:
  contents: read

concurrency:
  group: image-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boot:
    name: Build and boot the PC image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test and build the image
        uses: ./.github/actions/build-image
        with:
          target: amd64

      - name: Install QEMU, OVMF and sbverify
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf sbsigntool

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Larger than the image, so the first boot has a disk to grow into.
      - name: Put the image on a 12 GB disk
        id: disk
        run: |
          xz -dc out/*-amd64.img.xz > "$RUNNER_TEMP/kalinka.img"
          qemu-img resize -f raw "$RUNNER_TEMP/kalinka.img" 12G

      - name: Boot through UEFI with Secure Boot
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.ms.fd
        run: |
          packages/kalinka-image/tests/vm/boot.sh \
            "$RUNNER_TEMP/kalinka.img" uefi-secure-boot "$RUNNER_TEMP/secure-boot"

      # Also after a failed boot: what the image carries is often the reason.
      - name: Inspect the disk the Secure Boot run left
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        run: |
          sudo packages/kalinka-image/tests/vm/inspect.sh \
            "$RUNNER_TEMP/secure-boot/disk.img" "$RUNNER_TEMP/secure-boot/journal"

      - name: Boot through a legacy BIOS
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        run: |
          packages/kalinka-image/tests/vm/boot.sh \
            "$RUNNER_TEMP/kalinka.img" bios "$RUNNER_TEMP/bios"

      - name: Upload the boot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-boot-logs
          path: |
            ${{ runner.temp }}/secure-boot
            ${{ runner.temp }}/bios
            !${{ runner.temp }}/**/disk.img
          if-no-files-found: ignore
