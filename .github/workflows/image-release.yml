name: Image release

# Builds and publishes the ready-to-flash appliance images for a
# `kalinka-image-vX.Y.Z` tag, with the server, every first-party plugin, the
# browser player and the renderer already installed: two for the Raspberry Pi
# on DietPi, one for x86-64 on a minimal Debian 13.
#
# The images have their own release train because they change for reasons the
# app bundle does not — a Debian point release, a new DietPi, a first-boot fix —
# and because they are over a gigabyte of assets nobody wants on every patch
# release.
# Which Kalinka release goes inside is a separate choice: `kalinka_version`,
# or the latest published one when that is left empty.
#
# Each image is built on a runner of its own architecture, so nothing is
# emulated. Neither job runs in a container: the build needs loop devices and
# mounts on the host.

on:
  push:
    tags:
      - 'kalinka-image-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing kalinka-image-v* tag to build and publish'
        required: true
      kalinka_version:
        description: 'Kalinka release to install (default: the latest published)'
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  image:
    name: Image (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rpi234
            runner: ubuntu-24.04-arm
          - target: rpi5
            runner: ubuntu-24.04-arm
          - target: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap dosfstools e2fsprogs fdisk xz-utils curl gpg gpgv
          # Ubuntu's debootstrap carries no script for a Debian release younger
          # than itself, and every Debian suite script is the same file.
          [ -e /usr/share/debootstrap/scripts/trixie ] \
            || sudo ln -s sid /usr/share/debootstrap/scripts/trixie

      # In a container, so the tests that create accounts and regenerate host
      # keys get a throwaway system rather than this runner.
      - name: Test the image scripts
        run: make image-test

      - name: Build the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo --preserve-env=GITHUB_TOKEN \
            env OUT_DIR="$GITHUB_WORKSPACE/out" \
            packages/kalinka-image/build-image.sh \
            ${{ matrix.target }} ${{ github.event.inputs.kalinka_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [image]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather images and checksums
        run: |
          mkdir -p release
          find artifacts -name '*.img.xz' -exec cp -n {} release/ \;
          # One SHA256SUMS for the release replaces the per-image files the
          # build wrote for whoever runs it by hand.
          (cd release && sha256sum ./* > SHA256SUMS)
          ls -l release/
          cat release/SHA256SUMS

      - name: Create / update release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#kalinka-image-v}"
          echo "Publishing $TAG"

          cat > notes.md <<'EOF'
          Ready-to-flash images of Kalinka Player with the server, every first-party plugin, the browser player and the renderer already installed and enabled. Power one on, open `http://<its-ip>:8000` in a browser, and it plays — no install step, no login needed.

          | Image | For | Built on |
          |---|---|---|
          | `…-rpi234-arm64.img.xz` | Raspberry Pi 3, 4, 400, Zero 2 W, CM3 and CM4 | DietPi (Debian 13) |
          | `…-rpi5-arm64.img.xz` | Raspberry Pi 5, 500 and CM5 | DietPi (Debian 13) |
          | `…-amd64.img.xz` | Any x86-64 PC or virtual machine, UEFI or BIOS | Debian 13 |

          The Raspberry Pi images play through DAC HATs as well as USB DACs. A HAT with an ID EEPROM is set up by itself; for one without, see below.

          ## Flash it

          Use [Raspberry Pi Imager](https://www.raspberrypi.com/software/) or [balenaEtcher](https://etcher.balena.io/) and point them at the `.img.xz` as downloaded — both read it compressed. From a shell:

          ```sh
          xzcat kalinka-*.img.xz | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress
          ```

          The root filesystem grows into the card on first boot, so the size of the card is the size you get.

          ## Before the first boot, if you want Wi-Fi, a login or a DAC HAT

          None of this is needed just to play music: the player and the browser UI come up on their own. The images ship no password — a published image cannot carry one without handing it to everybody.

          **Raspberry Pi.** Edit DietPi's files on the KALINKA-BT drive that appears when the card is plugged into another computer:

          - a login: `AUTO_SETUP_GLOBAL_PASSWORD=` in `dietpi.txt`, or an SSH key in `AUTO_SETUP_SSH_PUBKEY=`;
          - Wi-Fi: `AUTO_SETUP_NET_WIFI_ENABLED=1` and your country code in `AUTO_SETUP_NET_WIFI_COUNTRY_CODE=`, then the network name and password in `dietpi-wifi.txt`;
          - a DAC HAT without an ID EEPROM: `CONFIG_SOUNDCARD=`, for example `hifiberry-digi`. Kalinka applies it and restarts once.

          DietPi reads these files on the first boot and removes them from the card. Raspberry Pi Imager's own OS customisation does not apply to these images. Leave `AUTO_SETUP_AUTOMATED` at 0.

          **PC.** Write `kalinka-firstboot.conf` to the FAT partition; `kalinka-firstboot.conf.example` sits beside it with every setting explained. It is read once, applied, and shredded.

          ## On the Raspberry Pi images

          Logging in for the first time starts DietPi's own first-run setup, which updates the system and may restart it; Kalinka does not need it. DietPi's update notices stay on and its survey is off, and logs are kept on disk rather than in memory.

          Verify downloads with `sha256sum -c SHA256SUMS --ignore-missing`.

          Full instructions: [docs/installation.md](https://github.com/Kalinka-Player/KalinkaPlayer/blob/main/docs/installation.md)
          EOF

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "Kalinka Player images $VERSION" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Restore the Latest badge to the app bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/pin-latest-release.sh
