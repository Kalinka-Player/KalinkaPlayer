name: Image release

# Builds and publishes the ready-to-flash appliance images for a
# `kalinka-image-vX.Y.Z` tag, with the server, every first-party plugin, the
# browser player and the renderer already installed: four for the Raspberry Pi
# (headless and -display) and one for x86-64 UEFI, all based on DietPi (Debian 13).
#
# The images have their own release train because they change for reasons the
# app bundle does not — a Debian point release, a new DietPi, a first-boot fix —
# and because they are over a gigabyte of assets nobody wants on every patch
# release.
# Which Kalinka release goes inside is a separate choice: `kalinka_version`,
# or the latest published one when that is left empty.
#
# Each image is built on a runner of its own architecture, so nothing is
# emulated. Neither job runs in a container: the build needs loop devices and
# mounts on the host.

on:
  push:
    tags:
      - 'kalinka-image-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing kalinka-image-v* tag to build and publish'
        required: true
      supervisor_version:
        description: 'Supervisor package version (empty uses a CI test version)'
        required: false
      kalinka_version:
        description: 'Kalinka release to install (default: the latest published)'
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match the requested tag to this workflow ref
        run: |
          case "$TAG" in kalinka-image-v*) ;; *) exit 1;; esac
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
  image:
    needs: validate
    uses: ./.github/workflows/image-build.yml
    with:
      kalinka_version: ${{ github.event.inputs.kalinka_version || '' }}
      supervisor_version: ${{ github.event.inputs.supervisor_version || '' }}

  release:
    name: Publish release
    needs: [image]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather images and checksums
        run: |
          mkdir -p release
          find artifacts \( -name '*.img.xz' -o -name '*.manifest.json' \) -exec cp -n {} release/ \;
          # One SHA256SUMS for the release replaces the per-image files the
          # build wrote for whoever runs it by hand.
          (cd release && sha256sum ./* > SHA256SUMS)
          ls -l release/
          cat release/SHA256SUMS

      - name: Create / update release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#kalinka-image-v}"
          echo "Publishing $TAG"

          bash scripts/image-release-notes.sh "$TAG" > notes.md

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "Kalinka Player images $VERSION" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Restore the Latest badge to the app bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/pin-latest-release.sh
