name: Image release

# Builds and publishes the ready-to-flash appliance images for a
# `kalinka-image-vX.Y.Z` tag, with the server, every first-party plugin, the
# browser player and the renderer already installed: two for the Raspberry Pi
# on DietPi, one for x86-64 on a minimal Debian 13.
#
# The images have their own release train because they change for reasons the
# app bundle does not — a Debian point release, a new DietPi, a first-boot fix —
# and because they are over a gigabyte of assets nobody wants on every patch
# release.
# Which Kalinka release goes inside is a separate choice: `kalinka_version`,
# or the latest published one when that is left empty.
#
# Each image is built on a runner of its own architecture, so nothing is
# emulated. Neither job runs in a container: the build needs loop devices and
# mounts on the host.

on:
  push:
    tags:
      - 'kalinka-image-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing kalinka-image-v* tag to build and publish'
        required: true
      kalinka_version:
        description: 'Kalinka release to install (default: the latest published)'
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  image:
    name: Image (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rpi234
            runner: ubuntu-24.04-arm
          - target: rpi5
            runner: ubuntu-24.04-arm
          - target: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap dosfstools e2fsprogs fdisk xz-utils curl gpg gpgv
          # Ubuntu's debootstrap carries no script for a Debian release younger
          # than itself, and every Debian suite script is the same file.
          [ -e /usr/share/debootstrap/scripts/trixie ] \
            || sudo ln -s sid /usr/share/debootstrap/scripts/trixie

      # In a container, so the tests that create accounts and regenerate host
      # keys get a throwaway system rather than this runner.
      - name: Test the image scripts
        run: make image-test

      - name: Build the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo --preserve-env=GITHUB_TOKEN \
            env OUT_DIR="$GITHUB_WORKSPACE/out" \
            packages/kalinka-image/build-image.sh \
            ${{ matrix.target }} ${{ github.event.inputs.kalinka_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [image]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather images and checksums
        run: |
          mkdir -p release
          find artifacts -name '*.img.xz' -exec cp -n {} release/ \;
          # One SHA256SUMS for the release replaces the per-image files the
          # build wrote for whoever runs it by hand.
          (cd release && sha256sum ./* > SHA256SUMS)
          ls -l release/
          cat release/SHA256SUMS

      - name: Create / update release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#kalinka-image-v}"
          echo "Publishing $TAG"

          bash scripts/image-release-notes.sh "$TAG" > notes.md

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "Kalinka Player images $VERSION" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Restore the Latest badge to the app bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/pin-latest-release.sh
