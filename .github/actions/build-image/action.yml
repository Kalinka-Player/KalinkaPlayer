name: Build an appliance image
description: >-
  Test the image scripts and build one target's image into out/. The release
  and the pull-request builds both run this, so what a pull request boots is
  what a release would ship. A target with an rpi-image-gen configuration is
  built from it; any other by build-image.sh.

inputs:
  target:
    description: >-
      A target in packages/kalinka-image/targets/, or one with a configuration
      in packages/kalinka-image/rpi-image-gen/config/
    required: true
  kalinka-version:
    description: 'Kalinka release to install (default: the latest published)'
    required: false
    default: ''
  supervisor-deb:
    description: 'Prebuilt supervisor package from the package job'
    required: false
    default: ''
  github-token:
    description: Raises the GitHub API rate limit while the build finds the release
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: packages/kalinka-supervisor/go.mod
        cache-dependency-path: packages/kalinka-supervisor/go.sum

    - name: Test the supervisor
      shell: bash
      run: make supervisor-test

    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          debootstrap dosfstools e2fsprogs fdisk xz-utils curl dpkg-dev podman
        # Ubuntu's debootstrap carries no script for a Debian release younger
        # than itself, and every Debian suite script is the same file.
        [ -e /usr/share/debootstrap/scripts/trixie ] \
          || sudo ln -s sid /usr/share/debootstrap/scripts/trixie

    # In a container, so the tests that create accounts and regenerate host
    # keys get a throwaway system rather than this runner.
    - name: Test the image scripts
      shell: bash
      run: make image-test

    - name: Build the image
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TARGET: ${{ inputs.target }}
        KALINKA_VERSION: ${{ inputs.kalinka-version }}
        SUPERVISOR_DEB: ${{ inputs.supervisor-deb }}
      run: |
        # As root, as build-image.sh is: rpi-image-gen runs in a privileged container.
        if [ -f "packages/kalinka-image/rpi-image-gen/config/kalinka-$TARGET.yaml" ]; then
          sudo --preserve-env=GITHUB_TOKEN \
            env OUT_DIR="$GITHUB_WORKSPACE/out" SUPERVISOR_DEB="$SUPERVISOR_DEB" \
            KALINKA_VERSION="$KALINKA_VERSION" \
            packages/kalinka-image/rpi-image-gen/build.sh "config/kalinka-$TARGET.yaml"
        else
          sudo --preserve-env=GITHUB_TOKEN \
            env OUT_DIR="$GITHUB_WORKSPACE/out" GO="$(command -v go)" \
            SUPERVISOR_DEB="$SUPERVISOR_DEB" IMAGE_SIZE=8GiB \
            packages/kalinka-image/build-image.sh \
            "$TARGET" ${KALINKA_VERSION:+"$KALINKA_VERSION"}
        fi
