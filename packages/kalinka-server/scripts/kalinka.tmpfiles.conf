d /run/kalinka 0755 kalusr kalusr -
# Outside /run/kalinka, which is kalinka.service's RuntimeDirectory and goes
# when it stops: the mount requests belong to root's units.
d /media/kalinka 0755 root root -
d /run/kalinka-mounts 0755 root root -
d /run/kalinka-mounts/requests 0770 root kalusr -
d /run/kalinka-mounts/results 0750 root kalusr -
