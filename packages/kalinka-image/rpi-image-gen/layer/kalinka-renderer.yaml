# METABEGIN
# X-Env-Layer-Name: kalinka-renderer
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: The Kalinka renderer alone, for a box that is an output of
#  a server elsewhere, with what it needs to upgrade itself when the server
#  asks: curl, CA certificates and python3 for install-renderer.sh.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: kalinka-renderer-base
# X-Env-Layer-AfterProvider: device,rpi-device
#
# X-Env-VarPrefix: kalinka
#
# X-Env-Var-renderer_deb:
# X-Env-Var-renderer_deb-Desc: A local renderer package to install instead of
#  the latest release's.
# X-Env-Var-renderer_deb-Required: n
# X-Env-Var-renderer_deb-Valid: string-or-empty
# X-Env-Var-renderer_deb-Set: y
#
# X-Env-Var-contents:
# X-Env-Var-contents-Desc: Where the hook records the renderer version it
#  installed, for build.sh to name the image.
# X-Env-Var-contents-Required: y
# X-Env-Var-contents-Valid: string
# X-Env-Var-contents-Set: y
#
# X-Env-Var-github_token_file:
# X-Env-Var-github_token_file-Desc: A file holding a GitHub token for the
#  install's API calls; a file, as every setting's value is printed.
# X-Env-Var-github_token_file-Required: n
# X-Env-Var-github_token_file-Valid: string-or-empty
# X-Env-Var-github_token_file-Set: y
#
# X-Env-Var-hook:
# X-Env-Var-hook-Desc: The script that installs the renderer into the root.
# X-Env-Var-hook-Required: y
# X-Env-Var-hook-Valid: string
# X-Env-Var-hook-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - curl
    - ca-certificates
    - python3
  customize-hooks:
    - '"$IGconf_kalinka_hook" "$1"'
