device:
  hostname: kalinka
  # Locked. Anything but none keeps sudo, which SSH setup needs.
  user1: kalinka
  user1sudo: passwd

image:
  layer: image-rpios
  boot_part_size: 256M
  root_part_size: 4G

layer:
  base: kalinka-base
  app: kalinka

kalinka:
  hook: ${@SRCROOT}/kalinka-hook.sh

splash:
  image_path: ${@SRCROOT}/splash/kalinka.tga
