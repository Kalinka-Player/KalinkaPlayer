[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-bluetooth"
dynamic = ["version"]
description = "Bluetooth A2DP input for local or remote Kalinka renderers"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["kalinka-plugin-sdk>=3.21,<4", "dbus-fast>=2.24,<6"]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_bluetooth = "kalinka_plugin_bluetooth:KalinkaPluginBluetooth"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/kalinka_plugin_bluetooth/_version.py"
tag_regex = "^kalinka-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"
search_parent_directories = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
