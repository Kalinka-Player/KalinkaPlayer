<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="kalusr">
    <allow send_destination="org.bluealsa" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluealsa" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluealsa" send_interface="org.bluealsa.PCM1"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AgentManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.MediaPlayer1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.MediaControl1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Device1" send_member="DisconnectProfile"/>
    <allow receive_sender="org.bluez" receive_interface="org.bluez.Agent1"/>
  </policy>
</busconfig>
